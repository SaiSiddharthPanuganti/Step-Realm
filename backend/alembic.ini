# Alembic configuration.
#
# sqlalchemy.url is intentionally absent: alembic/env.py reads DATABASE_URL
# from app.core.config so that migrations and the running service can never
# disagree about which database they are talking to.

[alembic]
script_location = alembic
prepend_sys_path = .
# Without this, Alembic falls back to splitting on spaces/commas/colons, which
# breaks on any Windows path containing a space (e.g. "C:\Users\Sai Siddharth").
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

# Timestamped, ordered revision filenames.
revision_environment = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
